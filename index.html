<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>😊 Sentiment Analysis</h1>
    <p>Enter your review and check whether it is Positive or Negative.</p>

    <form method="POST">
        <textarea name="text" placeholder="Type your review here..." required></textarea>

        <button type="submit">Analyze</button>
    </form>

    {% if prediction %}
    <div class="result">
        <h2>Prediction</h2>
        <p>{{ prediction }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
